<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background accent bar -->
  <rect x="0" y="85" width="600" height="8" rx="4" fill="url(#greenGrad)" opacity="0.15"/>

  <!-- "100x" in green -->
  <text x="160" y="130" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-size="100" font-weight="900" fill="url(#greenGrad)" letter-spacing="-2">
    100x
  </text>

  <!-- "win" in black -->
  <text x="390" y="130" font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-size="100" font-weight="900" fill="url(#darkGrad)" letter-spacing="2">
    win
  </text>

  <!-- Accent line under the text -->
  <rect x="160" y="145" width="320" height="4" rx="2" fill="url(#greenGrad)"/>
</svg>
